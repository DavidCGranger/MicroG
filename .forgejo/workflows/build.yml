name: MicroG APK Builder

on:
  workflow_dispatch:
  push:
    branches:
      - sdk-19
  pull_request:
    branches:
      - sdk-19

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Set up Android SDK
        run: |
          set -e
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          curl -fsSL -o /tmp/cmdline.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline.zip -d /tmp/cmdline
          mv /tmp/cmdline/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install NDK 21.0.6113669
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;21.0.6113669" >/dev/null || true

      - name: Grant execute permissions
        run: chmod +x ./gradlew

      - name: Build project
        run: ./gradlew build

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Build Unsigned Release APK
        run: ./gradlew assembleRelease

      - name: Upload APKs
        uses: https://data.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: MicroG-APKs
          path: |
            play-services-core/build/outputs/apk/debug/play-services-core-debug.apk
            play-services-core/build/outputs/apk/release/play-services-core-release-unsigned.apk
          retention-days: 30
