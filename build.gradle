buildscript {
    ext.androidMinSdk = 15
    ext.androidTargetSdk = 30
    ext.androidCompileSdk = 31

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:7.4.2'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.6.21'
        classpath "com.squareup.wire:wire-gradle-plugin:3.2.2"
    }
}

allprojects {
    apply plugin: 'idea'

    group = 'org.microg.gms'
    version = "0.2.24.261109"
    ext.appVersionCode = 261109001
    ext.isReleaseVersion = true

    configurations.all {
        resolutionStrategy {
            force 'androidx.lifecycle:lifecycle-runtime-ktx:2.4.0'
            force 'androidx.lifecycle:lifecycle-runtime:2.4.0'
            force 'androidx.lifecycle:lifecycle-viewmodel:2.4.0'
            force 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.4.0'
        }
    }
}

subprojects {
    repositories {
        jcenter()
        google()
    }
}
